<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Services — Compliant Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-top:#2e2568;
    --navy-bot:#171235;
    --line: rgba(255,255,255,0.12);
    --text-0:#f5f4fb;
    --text-1:#c3c1e0;
    --text-2:#7371a0;
    --signal-1:#ff8a4c;
    --signal-2:#ff5a1f;
    --signal-glow: rgba(255,122,61,0.45);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#eef0f4; }
  body{
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:40px 20px;
  }

  .panel{
    position:relative;
    width:100%;
    max-width:1170px;
    border-radius:20px;
    overflow:hidden;
    background: linear-gradient(160deg, var(--navy-top), var(--navy-bot) 78%);
    border:1px solid var(--line);
    box-shadow: 0 40px 90px -30px rgba(10,6,30,0.55);
    padding:38px 48px 40px;
  }

  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.10em;
    color:var(--text-1);
    text-transform:uppercase;
  }
  .eyebrow .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--signal-1);
    box-shadow:0 0 8px 1px var(--signal-glow);
    flex-shrink:0;
  }
  .eyebrow .arrow{ color: var(--text-2); font-weight:500; }

  .badge{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:14.5px;
    color: var(--signal-1);
    border:2px solid var(--signal-1);
    background: rgba(255,122,61,0.08);
    padding:9px 22px;
    border-radius:100px;
  }

  .row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-top:56px;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:110px;
  }
  .node{
    width:76px; height:76px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--line);
    background: rgba(255,255,255,0.02);
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
    flex-shrink:0;
  }
  .node svg{ width:32px; height:32px; }
  .node-icon{
    fill:none;
    stroke: var(--text-1);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease;
  }
  .stage.active .node{
    border-color: var(--signal-1);
    box-shadow: 0 0 0 6px rgba(255,122,61,0.10), 0 0 24px -2px var(--signal-glow);
  }
  .stage.active .node-icon{ stroke: var(--signal-1); }

  .stage-label{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16.5px;
    color: var(--text-1);
    margin-top:18px;
    transition: color 0.5s ease;
    white-space:nowrap;
  }
  .stage.active .stage-label,
  .stage.done .stage-label{ color: var(--text-0); }

  .connector{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:38px;
    min-width:20px;
  }
  .connector svg{ width:34px; height:14px; display:block; }
  .connector path{
    fill:none;
    stroke: var(--text-2);
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .caption{
    margin-top:52px;
    font-size:19px;
    color: var(--text-1);
    line-height:1.6;
    max-width:760px;
  }
  .caption b{ color: var(--text-0); font-weight:700; }

  @media (max-width:860px){
    .row{ flex-wrap:wrap; row-gap:34px; margin-top:38px; }
    .connector{ display:none; }
    .stage{ width:30%; }
    .caption{ font-size:16.5px; margin-top:36px; }
    .badge{ font-size:13px; padding:7px 16px; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="top-row">
    <div class="eyebrow"><span class="dot"></span>PROSPECTS <span class="arrow">→</span> COMPLIANT PIPELINE</div>
    <div class="badge">Live pipeline</div>
  </div>

  <div class="row" id="row">
    <div class="stage" id="stage-0">
      <div class="node">
        <svg viewBox="0 0 24 24">
          <circle class="node-icon" cx="10.5" cy="10.5" r="7.5"/>
          <line class="node-icon" x1="15.8" y1="15.8" x2="21" y2="21"/>
        </svg>
      </div>
      <div class="stage-label">Research</div>
    </div>

    <div class="connector"><svg viewBox="0 0 34 14"><path d="M1 7h28M22 1l8 6-8 6"/></svg></div>

    <div class="stage" id="stage-1">
      <div class="node">
        <svg viewBox="0 0 24 24">
          <rect class="node-icon" x="2" y="4" width="20" height="16" rx="2.5"/>
          <path class="node-icon" d="M2 6l10 7 10-7"/>
        </svg>
      </div>
      <div class="stage-label">Outreach</div>
    </div>

    <div class="connector"><svg viewBox="0 0 34 14"><path d="M1 7h28M22 1l8 6-8 6"/></svg></div>

    <div class="stage" id="stage-2">
      <div class="node">
        <svg viewBox="0 0 24 24">
          <path class="node-icon" d="M12 2l9 4v6c0 5.5-3.9 9.7-9 11-5.1-1.3-9-5.5-9-11V6l9-4z"/>
          <path class="node-icon" d="M8 12l2.5 2.5L16 9"/>
        </svg>
      </div>
      <div class="stage-label">Compliance</div>
    </div>

    <div class="connector"><svg viewBox="0 0 34 14"><path d="M1 7h28M22 1l8 6-8 6"/></svg></div>

    <div class="stage" id="stage-3">
      <div class="node">
        <svg viewBox="0 0 24 24">
          <path class="node-icon" d="M12 2L3 6v6c0 5.2 3.8 9.4 9 10 5.2-.6 9-4.8 9-10V6l-9-4z"/>
          <path class="node-icon" d="M12 8v5"/>
          <circle class="node-icon" cx="12" cy="16" r="0.6" fill="currentColor"/>
        </svg>
      </div>
      <div class="stage-label">Risk Check</div>
    </div>

    <div class="connector"><svg viewBox="0 0 34 14"><path d="M1 7h28M22 1l8 6-8 6"/></svg></div>

    <div class="stage" id="stage-4">
      <div class="node">
        <svg viewBox="0 0 24 24">
          <circle class="node-icon" cx="8" cy="7" r="3.4"/>
          <path class="node-icon" d="M1.5 21c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7"/>
          <circle class="node-icon" cx="18.5" cy="9" r="2.6"/>
          <path class="node-icon" d="M15.3 21c.3-3.3 2.4-5.6 5.2-6"/>
        </svg>
      </div>
      <div class="stage-label">Handoff</div>
    </div>
  </div>

  <div class="caption">
    Each deal moves through <b>research, compliance review, and risk clearance</b> — automatically becoming audit-ready pipeline.
  </div>
</div>

<script>
(function(){
  var stages = [0,1,2,3,4].map(function(i){ return document.getElementById('stage-'+i); });
  var HOLD = 1300;
  var idx = 0;

  function step(){
    stages.forEach(function(s){ s.classList.remove('active'); });
    stages[idx].classList.add('active');
    idx = (idx + 1) % stages.length;
    setTimeout(step, HOLD);
  }

  step();
})();
</script>

</body>
</html>
